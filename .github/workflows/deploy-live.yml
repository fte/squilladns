name: Deploy Live VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Sérialiser les déploiements : un dispatch manuel ou deux pushs simultanés
# ne doivent jamais se chevaucher.
concurrency:
  group: deploy-live
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: live

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          set -euo pipefail

          missing=0
          for name in VPS_HOST VPS_PATH VPS_SSH_KEY; do
            value="${!name:-}"
            if [[ -z "$value" ]]; then
              echo "Missing required secret: $name"
              missing=1
            fi
          done

          if [[ -z "${VPS_SSH_USER:-}" ]]; then
            echo "Missing required secret: VPS_SSH_USER"
            missing=1
          fi

          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

          echo "Secrets presence: OK"
          echo "Host length: ${#VPS_HOST}"
          echo "Path length: ${#VPS_PATH}"
          ssh_user="${VPS_SSH_USER:-}"
          echo "Port value: ${VPS_SSH_PORT:-5785}"
          echo "Selected user length: ${#ssh_user}"
          echo "SSH key length: ${#VPS_SSH_KEY}"
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: |
          make build-bin
          ls -lh target/release/squilladns
          file target/release/squilladns

      - name: SSH preflight debug (fingerprint + auth test)
        run: |
          set -euo pipefail

          SSH_USER="${VPS_SSH_USER:-}"
          SSH_PORT="${VPS_SSH_PORT:-5785}"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Conserver les sauts de ligne, retirer les éventuels retours chariot CRLF du secret
          printf '%s\n' "$VPS_SSH_KEY" | sed 's/\r$//' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          # S'assurer d'un saut de ligne final si absent
          [[ -s ~/.ssh/id_deploy && "$(tail -c 1 ~/.ssh/id_deploy)" != "" ]] && echo "" >> ~/.ssh/id_deploy

          echo "Private key header: $(head -n 1 ~/.ssh/id_deploy)"
          echo "Private key footer: $(tail -n 1 ~/.ssh/id_deploy)"
          ssh-keygen -lf ~/.ssh/id_deploy

          ssh-keyscan -p "$SSH_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          chmod 644 ~/.ssh/known_hosts

          echo "Testing SSH authentication..."
          set +e
          ssh -vvv -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=yes -p "$SSH_PORT" -i ~/.ssh/id_deploy "$SSH_USER@$VPS_HOST" 'echo SSH_OK && whoami'
          rc=$?
          set -e

          if [[ "$rc" -ne 0 ]]; then
            echo "SSH preflight failed with code $rc"
            echo "Most likely causes:"
            echo "1) Public key not present in ~/.ssh/authorized_keys for target user ($SSH_USER)"
            echo "2) Wrong target user secret (VPS_SSH_USER=$SSH_USER)"
            echo "3) Wrong SSH port (VPS_SSH_PORT=$SSH_PORT)"
            echo "4) Private key in secret does not match the installed public key on the server"
            exit "$rc"
          fi
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}

      - name: Copy binary to VPS and restart
        run: |
          set -euo pipefail

          SSH_USER="${VPS_SSH_USER:-}"
          SSH_PORT="${VPS_SSH_PORT:-5785}"
          TARGET_DIR="${VPS_PATH:-/home/gbp4dt5/zones/575.be/api.a/}"

          echo "[deploy] Ensuring remote directory exists: $TARGET_DIR"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -p "$SSH_PORT" -i ~/.ssh/id_deploy "$SSH_USER@$VPS_HOST" "mkdir -p '$TARGET_DIR'"

          echo "[deploy] Uploading binary to $TARGET_DIR/squilladns.new via SCP..."
          scp -P "$SSH_PORT" -i ~/.ssh/id_deploy target/release/squilladns "$SSH_USER@$VPS_HOST:$TARGET_DIR/squilladns.new"

          echo "[deploy] Activating binary and checking health on VPS..."
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -p "$SSH_PORT" -i ~/.ssh/id_deploy "$SSH_USER@$VPS_HOST" bash -s -- "$TARGET_DIR" << 'REMOTE_SCRIPT'
          set -euo pipefail
          APP_DIR="$1"
          cd "$APP_DIR"

          # Remplacement atomique du binaire
          chmod 755 squilladns.new
          mv squilladns.new squilladns
          echo "[deploy] squilladns binary updated successfully in $APP_DIR"

          # Script de relance dédié si présent
          if [[ -f restart.sh ]]; then
            echo "[deploy] Executing local restart.sh..."
            chmod +x restart.sh
            ./restart.sh
          # Redémarrage du service systemd si configuré
          elif command -v systemctl >/dev/null 2>&1; then
            if sudo -n systemctl is-active --quiet squilladns.service 2>/dev/null; then
              echo "[deploy] Restarting squilladns.service via sudo systemctl..."
              sudo -n systemctl restart squilladns.service
              sudo -n systemctl status squilladns.service | sed -n '1,15p' || true
            elif systemctl --user is-active --quiet squilladns.service 2>/dev/null; then
              echo "[deploy] Restarting squilladns.service via systemctl --user..."
              systemctl --user restart squilladns.service
              systemctl --user status squilladns.service | sed -n '1,15p' || true
            fi
          fi

          echo "[deploy] Checking API health..."
          ready=0
          for _ in {1..30}; do
            if curl -fsS http://127.0.0.1:8085/health >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done

          if [[ "$ready" -ne 1 ]]; then
            echo "[deploy] WARNING: API did not answer HTTP 200 on http://127.0.0.1:8085/health within timeout"
          else
            echo "[deploy] API is ready and healthy (HTTP 200 on /health)"
          fi
          REMOTE_SCRIPT

          echo "[deploy] Deployment completed successfully!"
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
