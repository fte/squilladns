name: Deploy Live VPS

on:
  # Déclenché manuellement via l'onglet Actions -> Run workflow pendant la phase de test.
  # Décommentez le bloc push ci-dessous pour automatiser le déploiement sur chaque commit sur main :
  # push:
  #   branches:
  #     - main
  workflow_dispatch:

concurrency:
  group: deploy-live
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: live

    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_PATH: ${{ secrets.VPS_PATH }}
      VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT || '5785' }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate required secrets
        run: |
          set -euo pipefail

          missing=0
          # VPS_KNOWN_HOSTS temporairement commenté pour debug
          for name in VPS_HOST VPS_PATH VPS_SSH_KEY VPS_SSH_USER; do
            value="${!name:-}"
            if [[ -z "$value" ]]; then
              echo "::error::Secret obligatoire manquant : $name"
              missing=1
            fi
          done

          if [[ "$missing" -ne 0 ]]; then
            echo "Veuillez renseigner les secrets requis dans Settings > Secrets and variables > Actions."
            exit 1
          fi

          echo "Secrets obligatoires configurés."

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # stable
        with:
          toolchain: stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@400e7407cfd7a091e5fbb6afec01ec146c432b7c # v2.7.7

      - name: Build release binary & compute checksum
        run: |
          make build-bin
          ls -lh target/release/squilladns
          file target/release/squilladns

          # Calcul du SHA256 pour vérification d'intégrité après téléversement
          BINARY_SHA256=$(sha256sum target/release/squilladns | awk '{print $1}')
          echo "BINARY_SHA256=$BINARY_SHA256" >> "$GITHUB_ENV"
          echo "Binaire compilé avec empreinte SHA256 : $BINARY_SHA256"

      - name: SSH preflight & verification (verbose debug)
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Conserver les sauts de ligne et retirer les retours chariot CRLF du secret
          printf '%s\n' "$VPS_SSH_KEY" | sed 's/\r$//' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          [[ -s ~/.ssh/id_deploy && "$(tail -c 1 ~/.ssh/id_deploy)" != "" ]] && echo "" >> ~/.ssh/id_deploy

          # Vérification stricte KNOWN_HOSTS commentée pour debug :
          # printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # chmod 644 ~/.ssh/known_hosts

          # Scan des clés d'hôte avec fallback
          ssh-keyscan -p "$VPS_SSH_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          chmod 644 ~/.ssh/known_hosts

          # Test verbeux (-vvv) de connexion SSH
          echo "Test de connexion SSH (-vvv) vers $VPS_SSH_USER@$VPS_HOST:$VPS_SSH_PORT..."
          ssh -vvv -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o StrictHostKeyChecking=no -p "$VPS_SSH_PORT" -i ~/.ssh/id_deploy "$VPS_SSH_USER@$VPS_HOST" 'echo SSH_OK && whoami'
          echo "Connexion SSH validée avec succès."

          # Vérification de l'architecture serveur (x86_64 attendu)
          remote_arch=$(ssh -o BatchMode=yes -o StrictHostKeyChecking=no -p "$VPS_SSH_PORT" -i ~/.ssh/id_deploy "$VPS_SSH_USER@$VPS_HOST" 'uname -m')
          echo "Architecture distante détectée : $remote_arch"
          if [[ "$remote_arch" != "x86_64" ]]; then
            echo "::error::Incompatibilité d'architecture : le serveur est $remote_arch, le binaire est x86_64."
            exit 1
          fi

      - name: Deploy binary, restart service & healthcheck with rollback
        run: |
          set -euo pipefail

          TARGET_DIR="${VPS_PATH}"
          EXPECTED_SHA256="${BINARY_SHA256}"

          SSH_OPTS="-o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o StrictHostKeyChecking=no"

          echo "[deploy] Création du dossier cible si nécessaire : $TARGET_DIR"
          ssh $SSH_OPTS -p "$VPS_SSH_PORT" -i ~/.ssh/id_deploy "$VPS_SSH_USER@$VPS_HOST" "mkdir -p '$TARGET_DIR'"

          echo "[deploy] Téléversement du binaire vers $TARGET_DIR/squilladns.new via SCP..."
          scp -o StrictHostKeyChecking=no -P "$VPS_SSH_PORT" -i ~/.ssh/id_deploy target/release/squilladns "$VPS_SSH_USER@$VPS_HOST:$TARGET_DIR/squilladns.new"

          echo "[deploy] Vérification intégrité, dépendances, installation atomique et redémarrage..."
          ssh $SSH_OPTS -p "$VPS_SSH_PORT" -i ~/.ssh/id_deploy "$VPS_SSH_USER@$VPS_HOST" bash -s -- "$TARGET_DIR" "$EXPECTED_SHA256" << 'REMOTE_SCRIPT'
          set -euo pipefail
          APP_DIR="$1"
          EXPECTED_SHA256="$2"
          cd "$APP_DIR"

          # 1. Vérification d'intégrité SHA256 post-téléversement
          echo "[deploy] Vérification SHA256 de squilladns.new..."
          ACTUAL_SHA256=$(sha256sum squilladns.new | awk '{print $1}')
          if [[ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]]; then
            echo "ERREUR : Intégrité compromise lors du transfert !"
            echo "  Attendu : $EXPECTED_SHA256"
            echo "  Reçu    : $ACTUAL_SHA256"
            rm -f squilladns.new
            exit 1
          fi
          echo "[deploy] Intégrité SHA256 confirmée ($ACTUAL_SHA256)."

          # 2. Préserver ou initialiser les permissions et l'appartenance
          if [[ -f squilladns ]]; then
            chmod --reference=squilladns squilladns.new 2>/dev/null || chmod 755 squilladns.new
            chown --reference=squilladns squilladns.new 2>/dev/null || true
          else
            chmod 755 squilladns.new
          fi

          # 3. Vérification des liaisons dynamiques ldd avant tout remplacement
          if command -v ldd >/dev/null 2>&1; then
            echo "[deploy] Vérification ldd de squilladns.new..."
            if ldd ./squilladns.new 2>&1 | grep -i "not found"; then
              echo "ERREUR : Dépendance dynamique manquante sur le VPS pour squilladns.new !"
              ldd ./squilladns.new
              rm -f squilladns.new
              exit 1
            fi
          fi

          # 4. Sauvegarde de l'ancien binaire pour rollback
          has_backup=0
          if [[ -f squilladns ]]; then
            cp -a squilladns squilladns.bak
            has_backup=1
            echo "[deploy] Sauvegarde squilladns.bak créée."
          fi

          rollback() {
            echo "=========================================================="
            echo "ALERTE : Déploiement échoué. Déclenchement du rollback..."
            echo "=========================================================="
            if [[ "$has_backup" -eq 1 && -f squilladns.bak ]]; then
              mv -f squilladns.bak squilladns
              echo "[rollback] Ancien binaire restauré depuis squilladns.bak."
              if [[ -f ./restart.sh ]]; then
                echo "[rollback] Relance via ./restart.sh..."
                ./restart.sh || echo "[rollback] Attention: restart.sh a échoué pendant le rollback"
              elif command -v systemctl >/dev/null 2>&1; then
                systemctl --user restart squilladns.service 2>/dev/null || sudo -n systemctl restart squilladns.service 2>/dev/null || true
              fi
              echo "[rollback] Service relancé avec l'ancien binaire."
            fi
            rm -f squilladns.new
          }

          # 5. Remplacement atomique
          mv -f squilladns.new squilladns
          echo "[deploy] squilladns remplacé avec succès."

          # 6. Redémarrage du service
          restarted=0
          if [[ -f ./restart.sh ]]; then
            echo "[deploy] Exécution de ./restart.sh..."
            chmod +x ./restart.sh
            if ./restart.sh; then
              restarted=1
            else
              echo "ERREUR : ./restart.sh a échoué (code de retour non nul)."
              rollback
              exit 1
            fi
          elif command -v systemctl >/dev/null 2>&1; then
            if sudo -n systemctl is-active --quiet squilladns.service 2>/dev/null; then
              echo "[deploy] Redémarrage via sudo systemctl restart squilladns.service..."
              sudo -n systemctl restart squilladns.service
              restarted=1
            elif systemctl --user is-active --quiet squilladns.service 2>/dev/null; then
              echo "[deploy] Redémarrage via systemctl --user restart squilladns.service..."
              systemctl --user restart squilladns.service
              restarted=1
            fi
          fi

          if [[ "$restarted" -ne 1 ]]; then
            echo "ERREUR : Aucun moyen de redémarrage fonctionnel (pas de ./restart.sh, et squilladns.service inactif)."
            rollback
            exit 1
          fi

          # 7. Contrôle de santé strict (HTTP 200 + parsing JSON status == ok)
          echo "[deploy] Vérification du contrat de santé sur http://127.0.0.1:8085/health..."
          ready=0
          last_code="000"
          last_body=""
          for _ in {1..30}; do
            # Timeout explicite de 3s par appel pour éviter tout blocage réseau
            response=$(curl --silent --show-error --max-time 3 -w "\n%{http_code}" http://127.0.0.1:8085/health 2>/dev/null || echo -e "\n000")
            last_code=$(echo "$response" | tail -n1)
            last_body=$(echo "$response" | sed '$d')

            if [[ "$last_code" == "200" ]]; then
              status=""
              if command -v jq >/dev/null 2>&1; then
                status=$(echo "$last_body" | jq -r .status 2>/dev/null || true)
              elif command -v python3 >/dev/null 2>&1; then
                status=$(echo "$last_body" | python3 -c 'import sys, json; print(json.load(sys.stdin).get("status", ""))' 2>/dev/null || true)
              elif echo "$last_body" | grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"'; then
                status="ok"
              fi

              if [[ "$status" == "ok" ]]; then
                ready=1
                break
              fi
            fi
            sleep 1
          done

          if [[ "$ready" -ne 1 ]]; then
            echo "ERREUR : L'API n'a pas répondu au contrat de santé sous 30s."
            echo "Dernier code HTTP reçu : $last_code"
            echo "Dernier corps de réponse : $last_body"
            if command -v systemctl >/dev/null 2>&1; then
              echo "=== Statut du service systemd ==="
              systemctl --user status squilladns.service 2>/dev/null || sudo -n systemctl status squilladns.service 2>/dev/null || true
              echo "=== Dernières lignes journalctl ==="
              journalctl --user -u squilladns.service -n 30 --no-pager 2>/dev/null || sudo -n journalctl -u squilladns.service -n 30 --no-pager 2>/dev/null || true
            fi
            rollback
            exit 1
          fi

          # Nettoyage du fichier de sauvegarde après validation complète du déploiement
          rm -f squilladns.bak
          echo "[deploy] Contrat de santé validé avec succès (HTTP 200, status: ok) : $last_body"
          REMOTE_SCRIPT

          echo "[deploy] Déploiement et contrôle de santé terminés avec succès !"
