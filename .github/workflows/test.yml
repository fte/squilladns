name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust-and-bind-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # stable
        with:
          toolchain: stable
          components: rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@400e7407cfd7a091e5fbb6afec01ec146c432b7c # v2.7.7

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Rust tests
        run: cargo test --locked

      - name: Install BIND 9
        run: |
          sudo apt-get update
          sudo apt-get install --yes bind9 bind9-utils

      - name: Run real BIND E2E test
        run: cargo test --locked --test bind_e2e -- --ignored --nocapture
