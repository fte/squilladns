version: "3.8"

services:
  dns-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: squilladns
    user: "${SQUILLADNS_UID:-1000}:${SQUILLADNS_GID:-1000}"
    ports:
      - "8085:8085"
    environment:
      - API_TOKEN=${API_TOKEN:-}
      - ZONES_DIR=/var/lib/squilladns/zones
      - API_TOKEN_PATH=/var/lib/squilladns/state/tokens
      - MAX_REQUEST_BODY_BYTES=${MAX_REQUEST_BODY_BYTES:-1048576}
      - MAX_RECORDS_PER_ZONE=${MAX_RECORDS_PER_ZONE:-10000}
      - MAX_RECORD_NAME_BYTES=${MAX_RECORD_NAME_BYTES:-253}
      - MAX_RECORD_VALUE_BYTES=${MAX_RECORD_VALUE_BYTES:-4096}
      - MAX_PARALLEL_VALIDATIONS=${MAX_PARALLEL_VALIDATIONS:-4}
      - MAX_PARALLEL_IO=${MAX_PARALLEL_IO:-4}
      - RNDC_BIN=${RNDC_BIN:-rndc}
      - RNDC_CONF=${RNDC_CONF:-}
      - RNDC_TIMEOUT_SECS=${RNDC_TIMEOUT_SECS:-5}
      - CHECKZONE_TIMEOUT_SECS=${CHECKZONE_TIMEOUT_SECS:-5}
      - RUST_LOG=${RUST_LOG:-info}
      - JWT_SECRET=${JWT_SECRET:-}
      - JWT_ED25519_PUBLIC_KEY=${JWT_ED25519_PUBLIC_KEY:-}
      - BFF_API_AUDIENCE=${BFF_API_AUDIENCE:-squilladns}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-*}
      - SANDBOX_USER=${SANDBOX_USER:-}
    volumes:
      # Persister les zones localement si besoin
      - ${SQUILLADNS_DATA_DIR:-./var/lib/squilladns}/zones:/var/lib/squilladns/zones
      - ${SQUILLADNS_DATA_DIR:-./var/lib/squilladns}/state:/var/lib/squilladns/state
    restart: unless-stopped
    networks:
      - dns-net

networks:
  dns-net:
    driver: bridge
