version: "3.8"

services:
  dns-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: squilladns
    ports:
      - "8085:8085"
    environment:
      - API_TOKEN=${API_TOKEN:-}
      - API_TOKEN_PATH=/app/state/tokens
      - MAX_REQUEST_BODY_BYTES=${MAX_REQUEST_BODY_BYTES:-1048576}
      - MAX_RECORDS_PER_ZONE=${MAX_RECORDS_PER_ZONE:-10000}
      - MAX_RECORD_NAME_BYTES=${MAX_RECORD_NAME_BYTES:-253}
      - MAX_RECORD_VALUE_BYTES=${MAX_RECORD_VALUE_BYTES:-4096}
      - RUST_LOG=${RUST_LOG:-info}
      - JWT_SECRET=${JWT_SECRET:-}
      - SANDBOX_USER=${SANDBOX_USER:-}
    volumes:
      # Persister les zones localement si besoin
      - ./zones:/app/zones
      - ./.state:/app/state
    restart: unless-stopped
    networks:
      - dns-net

networks:
  dns-net:
    driver: bridge
