[package]
name = "squilladns"
version = "0.1.0"
edition = "2021"

[dependencies]
hyper = { version = "1.12", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tokio = { version = "1.54", features = ["full"] }
hickory-server = "0.25"
hickory-proto = "0.25"
hickory-client = "0.25"
http-body-util = "0.1"
bytes = "1"
http = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2"
walkdir = "2"
rand = "0.8"
